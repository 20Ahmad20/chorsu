<title>Chorsu</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1230">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chorsu">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Manrope:wght@400;600;700;800&display=swap">
<style>
  :root{
    --bg-deep:#1B1230;
    --bg-vign:#100A1F;
    --panel:#2A1B42;
    --panel-edge:#4A3269;
    --cell-bg:#372450;
    --cell-edge:#4A3269;
    --ink:#F4E9D8;
    --muted:#B9A6C9;
    --gold:#E8B04B;
    --gold-soft:#F0C878;
    --gold-deep:#B9812A;
    --gold-glow:rgba(232,176,75,.5);
    --font-display:'Amiri', 'Noto Naskh Arabic', Georgia, serif;
    --font-body:'Manrope', 'Segoe UI', system-ui, sans-serif;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -8%, var(--panel) 0%, var(--bg-deep) 48%, var(--bg-vign) 100%);
    color:var(--ink);
    font-family:var(--font-body);
    display:flex;
    justify-content:center;
    padding: clamp(20px,5vw,44px) 16px;
  }

  .stage{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .lanterns{
    display:flex;
    justify-content:center;
    gap:14px;
    margin-bottom:-6px;
  }
  .lanterns span{
    width:7px;height:7px;border-radius:50%;
    background:var(--gold-soft);
    box-shadow:0 0 10px 3px var(--gold-glow);
    animation: flicker 3.2s ease-in-out infinite;
  }
  .lanterns span:nth-child(2){ animation-delay:.6s; }
  .lanterns span:nth-child(3){ animation-delay:1.2s; }
  .lanterns span:nth-child(4){ animation-delay:1.8s; }
  .lanterns span:nth-child(5){ animation-delay:2.4s; }
  @keyframes flicker{
    0%,100%{ opacity:.55; }
    50%{ opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .lanterns span{ animation:none; opacity:.85; }
  }

  .hero{ text-align:center; }
  .eyebrow{
    margin:0 0 6px;
    font-size:12px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
  }
  h1{
    margin:0;
    font-family:var(--font-display);
    font-size:clamp(40px,11vw,52px);
    line-height:1;
    color:var(--gold-soft);
    text-shadow:0 2px 18px rgba(232,176,75,.28);
    text-wrap:balance;
  }
  .tagline{
    margin:10px auto 0;
    max-width:32ch;
    font-size:14.5px;
    line-height:1.5;
    color:var(--muted);
    text-wrap:balance;
  }

  .statsbar{
    display:flex;
    align-items:stretch;
    gap:10px;
  }
  .stat{
    flex:1;
    background:linear-gradient(180deg, var(--panel), var(--bg-deep));
    border:1px solid var(--panel-edge);
    border-radius:14px;
    padding:10px 4px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  .stat-label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
  }
  .stat-value{
    font-size:22px;
    font-weight:800;
    color:var(--gold-soft);
    font-variant-numeric:tabular-nums;
  }
  .reset-btn{
    flex:1.15;
    border:1px solid var(--gold-deep);
    background:linear-gradient(180deg, var(--gold-soft), var(--gold-deep));
    color:#3B2A0E;
    font-family:var(--font-body);
    font-weight:800;
    font-size:14px;
    border-radius:14px;
    cursor:pointer;
    box-shadow:0 3px 0 var(--gold-deep), 0 6px 14px rgba(0,0,0,.35);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .reset-btn:hover{ filter:brightness(1.04); }
  .reset-btn:active{
    transform:translateY(3px);
    box-shadow:0 0 0 var(--gold-deep), 0 3px 8px rgba(0,0,0,.35);
  }
  .reset-btn:focus-visible, .gem:focus-visible{
    outline:2px solid var(--gold-soft);
    outline-offset:2px;
  }

  .tray{
    position:relative;
    padding:14px;
    border-radius:22px;
    background:
      linear-gradient(180deg, var(--panel), var(--bg-deep));
    border:1px solid var(--panel-edge);
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,.25),
      0 18px 40px rgba(0,0,0,.45);
  }
  .tray::before{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:16px;
    pointer-events:none;
    background-image: repeating-linear-gradient(45deg,
        transparent 0 8px,
        rgba(232,176,75,.10) 8px 9px,
        transparent 9px 17px,
        rgba(232,176,75,.10) 17px 18px);
    -webkit-mask-image: linear-gradient(#000, #000);
    opacity:.5;
  }

  .board{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    border-radius:12px;
    background:var(--cell-bg);
    box-shadow: inset 0 0 0 1px var(--cell-edge), inset 0 10px 26px rgba(0,0,0,.35);
    overflow:hidden;
  }
  .board::after{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,.16) 0 1px, transparent 1px calc(100%/7)),
      repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px calc(100%/7));
    pointer-events:none;
  }

  .cell-pos{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: left .32s cubic-bezier(.35,.65,.4,1.15), top .32s cubic-bezier(.35,.65,.4,1.15);
    z-index:1;
  }
  .cell-pos.falling-in{ z-index:2; }

  .gem{
    --c:#888; --cd:#555;
    width:80%;
    height:80%;
    border-radius:48% 44% 46% 50% / 44% 48% 42% 46%;
    cursor:pointer;
    background:
      radial-gradient(circle at 30% 24%, rgba(255,255,255,.55), transparent 38%),
      radial-gradient(circle at 76% 20%, var(--cd) 0 7%, transparent 8%),
      radial-gradient(circle at 22% 68%, var(--cd) 0 6%, transparent 7%),
      radial-gradient(circle at 60% 66%, var(--cd) 0 8%, transparent 9%),
      radial-gradient(circle at 46% 86%, var(--cd) 0 5%, transparent 6%),
      radial-gradient(circle at 66% 44%, rgba(0,0,0,.2), transparent 55%),
      var(--c);
    box-shadow: 0 3px 6px rgba(0,0,0,.35), inset 0 -3px 6px rgba(0,0,0,.18);
    transition: transform .16s ease, box-shadow .16s ease, opacity .22s ease;
  }
  .gem:hover{ transform:scale(1.05); }
  .cell-pos.selected .gem{
    transform:scale(1.14);
    box-shadow:0 0 0 3px var(--gold-soft), 0 0 14px 3px var(--gold-glow), 0 4px 8px rgba(0,0,0,.4);
  }
  .cell-pos.matched .gem{
    transform:scale(.1) rotate(25deg);
    opacity:0;
  }
  .cell-pos.spawning .gem{
    opacity:0;
    transform:scale(.4);
  }
  .cell-pos.spawn-in .gem{
    opacity:1;
    transform:scale(1);
  }
  .cell-pos.invalid .gem{
    animation: shake .32s ease;
  }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-4px); }
    75%{ transform:translateX(4px); }
  }

  .combo{
    position:absolute;
    left:50%; top:38%;
    transform:translate(-50%,-50%) scale(.8);
    font-family:var(--font-display);
    font-size:22px;
    color:var(--gold-soft);
    text-shadow:0 2px 10px rgba(0,0,0,.6);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
    z-index:5;
    white-space:nowrap;
  }
  .combo.show{
    opacity:1;
    transform:translate(-50%,-60%) scale(1);
  }

  .footnote{
    margin:0;
    text-align:center;
    font-size:12.5px;
    line-height:1.5;
    color:var(--muted);
  }

  @media (max-width:380px){
    h1{ font-size:38px; }
    .stat-value{ font-size:19px; }
  }
</style>

<div class="stage">
  <div class="lanterns" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <header class="hero">
    <p class="eyebrow">Bozor o'yini · prototip</p>
    <h1>Chorsu</h1>
    <p class="tagline">Ziravorlarni qatorlashtirib, Toshkentning eng gavjum bozorida ball to'plang.</p>
  </header>

  <div class="statsbar">
    <div class="stat">
      <span class="stat-label">Ball</span>
      <span id="score" class="stat-value">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Rekord</span>
      <span id="best" class="stat-value">0</span>
    </div>
    <button id="resetBtn" class="reset-btn" type="button">Yangi savat</button>
  </div>

  <div class="tray">
    <div id="board" class="board" role="grid" aria-label="Chorsu o'yin taxtasi"></div>
    <div id="combo" class="combo" aria-live="polite"></div>
  </div>

  <p class="footnote">Bitta ziravorni bosing, so'ng unga qo'shni ziravorni bosing — uchtasi qatorga tushsa, savatga tushib g'oyib bo'ladi.</p>
</div>

<script>
(function(){
  "use strict";

  var COLS = 7, ROWS = 7;
  var GEMS = [
    { key:'zafaron',   c:'#E8843A', cd:'#B85F22' },
    { key:'qalampir',  c:'#D24438', cd:'#9E2E24' },
    { key:'pista',     c:'#7DA84C', cd:'#587A30' },
    { key:'zardchoba', c:'#E7C13B', cd:'#B4931F' },
    { key:'kok',       c:'#3E5FA0', cd:'#293F72' },
    { key:'murch',     c:'#332838', cd:'#6B5F70' }
  ];

  var boardEl = document.getElementById('board');
  var comboEl = document.getElementById('combo');
  var scoreEl = document.getElementById('score');
  var bestEl  = document.getElementById('best');
  var resetBtn = document.getElementById('resetBtn');

  var grid;            // grid[row][col] = {id, type, el} | null
  var gemSeq = 1;
  var score = 0, best = 0;
  var selected = null;  // {row,col}
  var busy = false;

  function randType(){ return Math.floor(Math.random() * GEMS.length); }

  function makeGem(type, row, col){
    var el = document.createElement('div');
    el.className = 'cell-pos spawning';
    el.style.left = (col * 100 / COLS) + '%';
    el.style.top  = (row * 100 / ROWS) + '%';
    el.style.width  = (100 / COLS) + '%';
    el.style.height = (100 / ROWS) + '%';

    var g = document.createElement('div');
    g.className = 'gem';
    g.style.setProperty('--c', GEMS[type].c);
    g.style.setProperty('--cd', GEMS[type].cd);
    g.tabIndex = 0;
    g.setAttribute('role','gridcell');
    g.setAttribute('aria-label', GEMS[type].key);
    el.appendChild(g);

    var obj = { id: gemSeq++, type: type, el: el, row: row, col: col };
    el.addEventListener('click', function(){ onTileClick(obj); });
    g.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onTileClick(obj); }
    });
    boardEl.appendChild(el);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ el.classList.remove('spawning'); });
    });
    return obj;
  }

  function setPos(obj){
    obj.el.style.left = (obj.col * 100 / COLS) + '%';
    obj.el.style.top  = (obj.row * 100 / ROWS) + '%';
  }

  function neighborsMatch(r, c, t){
    if(c >= 2 && grid[r][c-1] && grid[r][c-1].type === t && grid[r][c-2] && grid[r][c-2].type === t) return true;
    if(r >= 2 && grid[r-1][c] && grid[r-1][c].type === t && grid[r-2][c] && grid[r-2][c].type === t) return true;
    return false;
  }

  function freshType(r, c){
    var t = randType(), tries = 0;
    while(neighborsMatch(r, c, t) && tries < 10){ t = randType(); tries++; }
    return t;
  }

  function initGrid(fromSaved){
    boardEl.innerHTML = '';
    grid = [];
    for(var r = 0; r < ROWS; r++){
      grid.push([]);
      for(var c = 0; c < COLS; c++){
        var t = (fromSaved && fromSaved[r] && fromSaved[r][c] != null) ? fromSaved[r][c] : freshType(r, c);
        grid[r].push(makeGem(t, r, c));
      }
    }
  }

  function updateStats(){
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function adjacent(a, b){
    return Math.abs(a.row - b.row) + Math.abs(a.col - b.col) === 1;
  }

  function clearSelection(){
    if(selected){ selected.el.classList.remove('selected'); selected = null; }
  }

  function onTileClick(obj){
    if(busy) return;
    if(!selected){
      selected = obj;
      obj.el.classList.add('selected');
      return;
    }
    if(selected.id === obj.id){ clearSelection(); return; }
    if(!adjacent(selected, obj)){
      clearSelection();
      selected = obj;
      obj.el.classList.add('selected');
      return;
    }
    var a = selected, b = obj;
    clearSelection();
    trySwap(a, b);
  }

  function swapData(a, b){
    grid[a.row][a.col] = b;
    grid[b.row][b.col] = a;
    var ar = a.row, ac = a.col;
    a.row = b.row; a.col = b.col;
    b.row = ar; b.col = ac;
    setPos(a); setPos(b);
  }

  function trySwap(a, b){
    busy = true;
    swapData(a, b);
    window.setTimeout(function(){
      var matches = findMatches();
      if(matches.length){
        resolveChain(matches, 1);
      } else {
        swapData(a, b);
        a.el.classList.add('invalid');
        b.el.classList.add('invalid');
        window.setTimeout(function(){
          a.el.classList.remove('invalid');
          b.el.classList.remove('invalid');
          busy = false;
        }, 340);
      }
    }, 260);
  }

  function findMatches(){
    var hit = {};
    var i, r, c, run;
    for(r = 0; r < ROWS; r++){
      run = [grid[r][0]];
      for(c = 1; c <= COLS; c++){
        var cur = c < COLS ? grid[r][c] : null;
        if(cur && run.length && cur.type === run[0].type){
          run.push(cur);
        } else {
          if(run.length >= 3){ for(i=0;i<run.length;i++) hit[run[i].id] = run[i]; }
          run = cur ? [cur] : [];
        }
      }
    }
    for(c = 0; c < COLS; c++){
      run = [grid[0][c]];
      for(r = 1; r <= ROWS; r++){
        var cur2 = r < ROWS ? grid[r][c] : null;
        if(cur2 && run.length && cur2.type === run[0].type){
          run.push(cur2);
        } else {
          if(run.length >= 3){ for(i=0;i<run.length;i++) hit[run[i].id] = run[i]; }
          run = cur2 ? [cur2] : [];
        }
      }
    }
    var out = [];
    for(var k in hit) out.push(hit[k]);
    return out;
  }

  function showCombo(text){
    comboEl.textContent = text;
    comboEl.classList.remove('show');
    void comboEl.offsetWidth;
    comboEl.classList.add('show');
    window.clearTimeout(showCombo._t);
    showCombo._t = window.setTimeout(function(){ comboEl.classList.remove('show'); }, 700);
  }

  function resolveChain(matched, chainLevel){
    var gained = matched.length * 10 * (1 + (chainLevel - 1) * 0.5);
    score += Math.round(gained);
    if(score > best){ best = score; try{ localStorage.setItem('chorsu_best', String(best)); }catch(e){} }
    updateStats();
    if(chainLevel > 1) showCombo('Kombo ×' + chainLevel + '!');

    var i;
    for(i = 0; i < matched.length; i++){
      matched[i].el.classList.add('matched');
    }

    window.setTimeout(function(){
      for(i = 0; i < matched.length; i++){
        var m = matched[i];
        grid[m.row][m.col] = null;
        m.el.remove();
      }
      applyGravityAndRefill();

      window.setTimeout(function(){
        var next = findMatches();
        if(next.length){
          resolveChain(next, chainLevel + 1);
        } else {
          busy = false;
          persist();
        }
      }, 300);
    }, 230);
  }

  function applyGravityAndRefill(){
    for(var c = 0; c < COLS; c++){
      var stack = [];
      var r;
      for(r = ROWS - 1; r >= 0; r--){
        if(grid[r][c]) stack.push(grid[r][c]);
      }
      var writeRow = ROWS - 1;
      for(var s = 0; s < stack.length; s++){
        var obj = stack[s];
        grid[writeRow][c] = obj;
        if(obj.row !== writeRow){ obj.row = writeRow; setPos(obj); }
        writeRow--;
      }
      var missing = writeRow + 1;
      for(r = writeRow; r >= 0; r--){
        var t = randType();
        var spawnRow = r - missing;
        var newObj = makeGem(t, spawnRow, c);
        newObj.el.style.top = (spawnRow * 100 / ROWS) + '%';
        grid[r][c] = newObj;
        newObj.row = r; newObj.col = c;
        (function(o, targetRow){
          requestAnimationFrame(function(){
            requestAnimationFrame(function(){ o.row = targetRow; setPos(o); });
          });
        })(newObj, r);
      }
    }
  }

  function persist(){
    if(!(window.claude && window.claude.hot)) return;
    var flat = [];
    for(var r = 0; r < ROWS; r++){
      var row = [];
      for(var c = 0; c < COLS; c++) row.push(grid[r][c] ? grid[r][c].type : null);
      flat.push(row);
    }
    window.claude.hot.snapshot({ grid: flat, score: score, best: best });
  }

  resetBtn.addEventListener('click', function(){
    if(busy) return;
    score = 0;
    updateStats();
    initGrid(null);
    persist();
  });

  function start(data){
    try{ best = parseInt(localStorage.getItem('chorsu_best'), 10) || 0; }catch(e){ best = 0; }
    if(data && data.best) best = Math.max(best, data.best);
    if(data && data.grid){
      score = data.score || 0;
      initGrid(data.grid);
    } else {
      score = 0;
      initGrid(null);
    }
    updateStats();
  }

  if(window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(start);
  } else {
    start((window.claude && window.claude.hot && window.claude.hot.data) || null);
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
